profiles:
  cautious:
    description: Capital preservation first. Horizon < 3 years or low tolerance for
      drawdowns.
    targets:
      global_equity: 0.4
      global_bonds_hedged: 0.6
  balanced:
    description: Growth with a bond cushion. Horizon 3-8 years or medium tolerance.
    targets:
      global_equity: 0.6
      small_cap: 0.05
      emerging_markets: 0.05
      global_bonds_hedged: 0.3
  growth:
    description: Equity-heavy. Horizon >= 8 years and you would hold or buy through
      a -30% year.
    targets:
      global_equity: 0.8
      small_cap: 0.1
      emerging_markets: 0.1
  aggressive_thematic:
    description: Growth core plus a thematic satellite (pick candidate UCITS ETFs,
      no leverage) plus an eToro single-stocks satellite. Horizon >= 10 years,
      accepts -35% in a 2020-type crash and ~-55% in a 2008-type one.
    targets:
      global_equity: 0.70
      small_cap: 0.05
      thematic: 0.20
      single_stocks: 0.05
