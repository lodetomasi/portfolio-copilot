# Hidden-exposure graph (V2, read-only reference data -- edit by hand, not generated).
#
# Curated mapping from an instrument's name/sector/industry to thematic "buckets" and the
# shared macro/factor drivers behind them. Used by portfolio/exposure.py to reveal exposure
# that isn't obvious from sector labels alone -- e.g. a "small cap world" ETF, a chip stock
# and an AI-software fund can all lean on the same ai_capex driver even though they sit in
# different sectors on paper.
#
# Schema per theme:
#   keywords: case-insensitive substrings matched against "name sector industry" joined.
#   drivers:  shared macro/factor drivers this theme is exposed to.
# Both lists are required and non-empty (see portfolio/exposure.py::load_graph, which
# validates this file and refuses to degrade silently on a malformed entry).
#
# An instrument matching no theme below is classified "unclassified" rather than guessed.
# A leveraged instrument (asset_type "certificate" or |leverage| > 1) always additionally
# carries "leveraged_certificates" (driver leverage_decay) on top of whatever underlying
# theme its name/sector/industry matched.

themes:
  global_equity_core:
    keywords:
      - "all-world"
      - "all world"
      - "ftse all-world"
      - "msci world"
      - "s&p 500"
      - "sp 500"
      - "world index"
      - "world equity"
    drivers:
      - equity_beta_global
      - usd

  small_cap:
    keywords:
      - "small cap"
      - "small-cap"
      - "smallcap"
      - "russell 2000"
    drivers:
      - equity_beta_global
      - small_cap_liquidity
      - rates_eur

  emerging_markets:
